<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SignVision ASL Studio — Real-time American Sign Language recognition using EfficientNetB0 and MediaPipe Hand Landmarker.">
    <title>SignVision — ASL Studio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Studio Styles -->
    <link rel="stylesheet" href="css/studio.css">

    <!-- MediaPipe (frontend hand overlay visualization only) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- ================================================== -->
    <!-- HEADER — Branding & System Status                  -->
    <!-- ================================================== -->
    <header class="top-bar">
        <div class="header-left">
            <div class="brand">
                <span class="brand-name">SignVision</span>
                <span class="brand-sep">/</span>
                <span class="brand-page">ASL Studio</span>
            </div>
            <div class="demo-badge hidden" id="demo-badge">DEMO</div>
        </div>

        <div class="status-row" role="status" aria-live="polite">
            <div class="status-item" id="status-camera" title="Camera stream">
                <span class="status-indicator" id="cam-status"></span>
                <span class="status-label" id="cam-status-text">CAMERA</span>
            </div>
            <div class="status-divider"></div>
            <div class="status-item" id="status-hand" title="Hand detection">
                <span class="status-indicator" id="hand-status"></span>
                <span class="status-label" id="hand-status-text">HAND</span>
            </div>
            <div class="status-divider"></div>
            <div class="status-item" id="status-model" title="Backend model connection">
                <span class="status-indicator" id="ai-status"></span>
                <span class="status-label" id="ai-status-text">MODEL</span>
            </div>
        </div>
    </header>

    <!-- ================================================== -->
    <!-- MAIN WORKSPACE                                     -->
    <!-- ================================================== -->
    <main class="studio-layout">

        <!-- ============================================== -->
        <!-- LEFT: Camera Feed                              -->
        <!-- ============================================== -->
        <section class="video-section" aria-label="Camera feed">
            <div class="video-container">
                <video id="camera" autoplay playsinline muted></video>
                <canvas id="hand-overlay"></canvas>

                <!-- Camera status overlay -->
                <div class="cam-overlay hidden" id="cam-overlay-msg">
                    <div class="cam-overlay-inner">
                        <div class="cam-spinner" id="cam-spinner"></div>
                        <span id="cam-msg-text">Initializing camera...</span>
                    </div>
                </div>

                <!-- Camera toggle -->
                <div class="video-controls">
                    <button class="btn-cam" id="btn-toggle-cam" aria-label="Toggle camera">
                        <span id="btn-toggle-cam-text">STOP</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- ============================================== -->
        <!-- RIGHT: Prediction Panel                        -->
        <!-- ============================================== -->
        <section class="prediction-panel" aria-label="Prediction output">

            <!-- Current Sign -->
            <div class="panel-block" id="block-prediction">
                <div class="block-label">CURRENT SIGN</div>
                <div class="prediction-state-badge" id="stability-badge">
                    <span class="state-dot" id="state-dot"></span>
                    <span id="stability-text">Waiting...</span>
                </div>

                <div class="letter-display">
                    <div class="prediction-letter" id="prediction-letter" aria-label="Detected letter">—</div>
                </div>

                <div class="conf-block">
                    <div class="conf-row">
                        <span class="conf-label">CONFIDENCE</span>
                        <span class="conf-value" id="confidence-value">—</span>
                    </div>
                    <div class="conf-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                        <div class="conf-bar-fill" id="confidence-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Recent Signs -->
            <div class="panel-block" id="block-history">
                <div class="block-label">RECENT SIGNS</div>
                <div class="history-row" id="recent-signs-container">
                    <span class="history-empty">No signs detected yet</span>
                </div>
            </div>

        </section>

    </main>

    <!-- ================================================== -->
    <!-- SENTENCE BUILDER FOOTER                            -->
    <!-- ================================================== -->
    <footer class="sentence-builder" aria-label="Sentence builder">
        <div class="builder-top">
            <div class="builder-meta">
                <span class="builder-label">MESSAGE</span>
                <span class="char-badge" id="char-count-badge">0 chars</span>
            </div>
            <div class="builder-controls">
                <button class="btn-action btn-add" id="btn-add" aria-label="Add letter to sentence">
                    + ADD LETTER
                    <kbd>Space</kbd>
                </button>
                <button class="btn-action btn-delete" id="btn-delete" aria-label="Delete last character">
                    DELETE
                    <kbd>⌫</kbd>
                </button>
                <button class="btn-action btn-clear" id="btn-clear" aria-label="Clear sentence">
                    CLEAR
                    <kbd>↵</kbd>
                </button>
            </div>
        </div>
        <div class="sentence-display" id="sentence-display" aria-label="Sentence output">
            <span class="sentence-placeholder">Sign a letter, then press [+ ADD LETTER] to build a word...</span>
        </div>
    </footer>

    <!-- Toast notifications -->
    <div class="toast-stack" id="toast-container" aria-live="polite"></div>

    <!-- JavaScript modules -->
    <script src="js/camera.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/sentence.js"></script>
    <script src="js/studio.js"></script>

</body>

</html>
